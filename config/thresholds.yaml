# Central config — no thresholds, paths, or constants should be hardcoded in src/.

database:
  path: "db/brahmo.sqlite3"

data_sources:
  cdci: { path: "data/cdci_drug_subset.csv", version_column: "source_version" }
  nlem: { path: "data/nlem_extract.csv" }
  jan_aushadhi: { path: "data/jan_aushadhi_extract.csv" }
  regulatory_events: { path: "data/regulatory_gazette_events.csv" }
  pharmacy_stock: { path: "data/pharmacy_stock.csv" }
  severe_interactions: { path: "data/severe_interaction_seed.csv" }
  seed_prescriptions: { path: "data/seed_prescriptions_template.csv" }
  local_protocol: { path: "data/local_protocol_acute_fever.md" }
  corpus_dir: "corpus/"

normalization:
  # Confidence assigned to a mapping that came straight from a structured source
  # column (e.g. CDCI's own ingredient_1/2/3 fields) — no matching was performed.
  structured_source_confidence: 1.0

  # Confidence assigned to an exact match after normalizing case/whitespace/hyphens.
  # This is the ONLY tier allowed to auto-resolve.
  exact_match_confidence: 0.9

  # rapidfuzz score (0-100) below which a fuzzy candidate isn't even worth queuing
  # as evidence (it's noise, not a real candidate).
  fuzzy_candidate_floor: 60

  # How many fuzzy candidates to keep as evidence when queuing an item for review.
  fuzzy_top_k: 3

  # NOTE: there is deliberately no "fuzzy auto-accept" threshold. Any match that
  # required fuzzy/approximate matching (not an exact normalized-string match) is
  # always queued for review, regardless of score. See DESIGN.md D-002.

rail:
  # every check must resolve to one of exactly these states
  states:
    - HIT
    - CHECKED_NO_HIT
    - PARTIAL_COVERAGE
    - UNVERIFIED_INPUT
    - NOT_CHECKED
    - DATA_EXPIRED
    - SOURCE_CONFLICT
    - SERVICE_UNAVAILABLE

retrieval:
  chunking_unit: "decision_unit"   # never blind token slices
  hybrid_weight_lexical: 0.5
  hybrid_weight_semantic: 0.5
  top_k: 8
